command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: ZOMATO_INVESTIGATION_JOB_ID
    valueFrom: investigation-job
  - name: DATABRICKS_MODEL_ENDPOINT
    value: databricks-gpt-oss-120b
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
